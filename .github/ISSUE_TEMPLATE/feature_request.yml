name: Feature request
description: Propose a new capability or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the project do instead? Include how someone would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other designs you considered, and why they fall short.
  - type: textarea
    id: acceptance
    attributes:
      label: How we will know it works
      description: An observable result that a check could verify.
