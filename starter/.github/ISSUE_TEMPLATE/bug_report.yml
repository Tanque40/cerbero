name: Bug report
description: Report behavior that differs from what the documentation promises.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow the private reporting route in `SECURITY.md` instead.
        Remove credentials, secrets and personal data from everything you paste.
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The behavior you observed, including exact error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behavior you expected and where it is documented, if anywhere.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of commands or actions that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version or commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture and any relevant tool versions.
